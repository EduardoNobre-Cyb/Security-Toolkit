services:
  toolkit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: security-toolkit
    restart: unless-stopped
    environment:
      # API Keys and Configuration - read from config.ini
      # Or set these env vars if config.ini is not mounted
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      THRESHOLD: ${THRESHOLD:-5}
    volumes:
      # Mount config.ini from host
      - ./config.ini:/app/config.ini
      # Results volume for scan reports and logs
      - ./results:/app/results
      # Log files volume
      - ./logs:/app/logs
    # For interactive mode, use stdin_open and tty
    stdin_open: true
    tty: true

volumes:
  results:
  logs:
